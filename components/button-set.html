<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Components</title>
    <style>
        body {
            background-color: aliceblue;
            font-family: arial;
            margin: 3%;
        }
        h2 {
            color: black;
            font-size: 20px;
            margin-bottom: 3%;
        }
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
        }
        .button-group .btn{
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .btn-primary{
            background: darkblue;
            outline: 2px solid white;
            color: white;
        }
        .btn-secondary{
            background: cornflowerblue;
            outline: 2px solid white;
            color: black;
        }
        .btn-outline{
            background: white;
            outline: 2px solid rgb(4, 108, 172);
            color: black;
        }
        .btn-send{
            background: goldenrod;
            outline: 2px solid white;
            color: white;
        }
        footer {
            margin-top: 5%;
        }
        .btn:hover {
            margin: 20px;
        }
    </style>
</head>

<body>
    <main>
        <h2>Normal</h2>
        <div class="button-group">
            <a href="" class="btn btn-primary">Lihat Proyek</a>
            <a href="" class="btn btn-secondary">Unduh CV</a>
            <a href="" class="btn btn-outline">Hubungi Saya</a>
            <a href="" class="btn btn-send">Kirim Pesan</a>
        </div>
    </main>

    <footer>
        <a href="">Kembali ke Beranda</a>
    </footer>
</body>

</html>
